name: Build Locket
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test book rules
        run: swiftc Shared/Book.swift Tests/main.swift -o "$RUNNER_TEMP/book-tests" && "$RUNNER_TEMP/book-tests"
      - name: Build app and embedded widget
        run: |
          set -euo pipefail
          xcodebuild -project Locket.xcodeproj -scheme Locket -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          test -x build/Build/Products/Debug-iphonesimulator/Locket.app/PlugIns/FriendsStamps.appex/FriendsStamps
      - name: Capture sample stamp books on iPhone
        if: github.event_name != 'pull_request'
        run: Tools/capture-screens.sh build/Build/Products/Debug-iphonesimulator/Locket.app screenshots
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Locket-iPhone-screens
          path: screenshots/
  device:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test stamp book and social access rules
        run: |
          swiftc Shared/Book.swift Tests/main.swift -o "$RUNNER_TEMP/book-tests" && "$RUNNER_TEMP/book-tests"
          swiftc -target "$(uname -m)-apple-macos15.0" Shared/Book.swift Shared/Storage.swift Shared/CloudBooks.swift Tests/Social/main.swift -o "$RUNNER_TEMP/social-tests" && "$RUNNER_TEMP/social-tests"
      - name: Archive for device signing
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          export DEVELOPER_DIR="$xcode/Contents/Developer"
          xcodebuild -project Locket.xcodeproj -scheme Locket -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Locket.xcarchive" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO archive
          ditto -c -k --keepParent "$RUNNER_TEMP/Locket.xcarchive" Locket-device.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Locket-device-archive
          path: Locket-device.zip
      - name: Sign and deliver to internal TestFlight
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        timeout-minutes: 40
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_PROVISION_PROFILE_BASE64: ${{ secrets.APP_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISION_PROFILE_BASE64 }}
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          export DEVELOPER_DIR="$xcode/Contents/Developer"
          Tools/ship-testflight.sh "$RUNNER_TEMP/Locket.xcarchive"
